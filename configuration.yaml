api:
  host: "0.0.0.0"
  port: 10006
  debug: true

pipeline:
  batch_time_budget: 2050
  candidate_deadline_s: 1450
  prompt_timeout: 600.0
  use_planner: false
  render_from_object: true
  refinement_enabled: false
  orientation:
    enabled: true
    img_size: 512
  seed_offset: 8675309
  # Warm-up coder throughput probe: 48 text-only code requests x 512 tokens, aggregate output tok/s.
  # min_tps 0 = measure and log only. CALIBRATE before enabling: run one healthy 4xH200 pod, read
  # "[Coder probe] ... tok/s" from pipeline.log, set min_tps to ~0.8x that value.
  coder_probe:
    enabled: true
    concurrency: 48
    max_tokens: 512
    min_tps: 0

preflight:
  min_tflops: 30
  min_stream48_gbps: 0
  min_power_limit_w: 700

benchmark: true
warmup: true

llm_clients:
  openrouter:
    enabled: false
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
  coder-instance:
    enabled: true
    base_url: "http://localhost:8001/v1"
    api_key: "local"
    request_timeout_s: 900
    vllm:
      model: "computer-vision-ai-lab/Qwen-3.6-27B-AmberKite"
      revision: "14adb741b473bbd7bc0d02cacb27247d2cb707f6"
      gpu_ids: "0,1"
      tensor_parallel_size: 1
      data_parallel_size: 2
      vllm_bin: "/opt/vllm-coder-env/bin/vllm"
      gpu_memory_utilization: 0.9
      max_model_len: 81920
      max_num_seqs: 256
      extra_args: ["--speculative-config", "{\"method\":\"mtp\",\"num_speculative_tokens\":2}"]
  judge-critic-instance:
    enabled: true
    base_url: "http://localhost:8002/v1"
    api_key: "local"
    request_timeout_s: 300
    vllm:
      model: "zai-org/GLM-4.6V-Flash"
      revision: "411bb4d77144a3f03accbf4b780f5acb8b7cde4e" 
      gpu_ids: "2"
      tensor_parallel_size: 1
      data_parallel_size: 1
      gpu_memory_utilization: 0.9
      max_model_len: 81920
      max_num_seqs: 64
      extra_args: ["--max-num-batched-tokens", "16384"]
      vllm_bin: "/opt/vllm-glm-env/bin/vllm"
      trust_remote_code: true
      reasoning_parser: null
  judge-critic-instance-b:
    enabled: true
    base_url: "http://localhost:8020/v1"
    api_key: "local"
    request_timeout_s: 300
    vllm:
      model: "zai-org/GLM-4.6V-Flash"
      revision: "411bb4d77144a3f03accbf4b780f5acb8b7cde4e" 
      gpu_ids: "3"
      tensor_parallel_size: 1
      data_parallel_size: 1
      gpu_memory_utilization: 0.9
      max_model_len: 81920
      max_num_seqs: 64
      extra_args: ["--max-num-batched-tokens", "16384"]
      vllm_bin: "/opt/vllm-glm-env/bin/vllm"
      trust_remote_code: true
      reasoning_parser: null

embedder:
  model_id: "computer-vision-ai-lab/dinov3-vits16-pretrain-lvd1689m"
  revision: "e2b5191960331471bf2734d372e6a7151a6079c5"

actors:
  planner:
    client: "coder-instance"
    model: "computer-vision-ai-lab/Qwen-3.6-27B-AmberKite"
    workers: 256
    queue_size: 128
    max_tokens: 32768
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    seed: 42
    reasoning_effort: "medium"
    enable_thinking: false
    providers:
      order: []
      allow_fallbacks: true
  coder:
    client: "coder-instance"
    model: "computer-vision-ai-lab/Qwen-3.6-27B-AmberKite"
    workers: 96
    queue_size: 64
    max_tokens: 24576
    temperature: 0.7
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    seed: 42
    enable_thinking: false
    multimodal: true
    ensemble_size: 46
    ensemble_temperature: 0.7
    providers:
      order: []
      allow_fallbacks: true
  patcher:
    workers: 64
    queue_size: 64
  critic:
    client: "judge-critic-instance"
    model: "zai-org/GLM-4.6V-Flash"
    workers: 128
    queue_size: 64
    max_tokens: 6144
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    seed: 42
    reasoning_effort: "medium"
    enable_thinking: false
    ensemble_size: 1
    providers:
      order: []
      allow_fallbacks: true
  judge:
    client: "judge-critic-instance"
    extra_clients: ["judge-critic-instance-b"]
    s1_early_stop:
      enabled: true
      angles: 2
      min_gap: 2.0
      single_angle_min_gap: 2.5
      max_round: 4
    model: "zai-org/GLM-4.6V-Flash"
    workers: 48
    queue_size: 48
    max_tokens: 8192
    temperature: 0.0
    seed: 42
    max_stage: 3
    providers:
      order: []
      allow_fallbacks: true
  checker:
    workers: 32
    queue_size: 32
  renderer:
    workers: 16
    queue_size: 32

event_bus:
  max_iter: 2
  task_deadline_s: 1800
  score_threshold: 0.55

js_checker:
  execution_timeout_ms: 5000
  node_binary: "node"

renderer:
  sidecar_host: "127.0.0.1"
  sidecar_port: 8003
  startup_timeout_s: 60.0
  request_timeout_s: 90.0
  node_binary: "node"
  img_size: 1024
  grid_gap: 5
  bg_color: null
  lighting: neutral
  sidecar_count: 8
  pool_size: 2
  render_timeout_ms: 60000
  protocol_timeout_ms: 60000